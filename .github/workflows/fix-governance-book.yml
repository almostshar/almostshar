name: Temporary governance book correction

on:
  push:
    paths:
      - '.github/workflows/fix-governance-book.yml'

permissions:
  contents: read

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-14d0-81fa-b513-0bd6a0b0c6e6/raw?se=2026-08-04T10:47:31Z&sp=r&sv=2026-02-06&sr=b&scid=ff1f82d9-717e-5b1c-93dd-6ffb5b47ac87&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T23:05:52Z&ske=2026-08-04T23:05:52Z&sks=b&skv=2026-02-06&sig=%2B1ATl0le1z9aC6EhZZs1vhOCA8RFlHdHJKcBoMydrVQ%3D'
    steps:
      - name: Download source immediately
        run: |
          curl --fail --location --silent --show-error "$SOURCE_URL" --output source.docx
          test -s source.docx
          file source.docx

      - name: Install document tools and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core
          sudo apt-get install -y -qq fonts-hosny-amiri || true
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f

      - name: Correct Table 25 and mark all fields dirty
        run: |
          cat > fix_book.py <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import re
          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from docx.shared import Pt

          SRC = Path('source.docx')
          OUT = Path('book_preflight.docx')
          doc = Document(SRC)

          def norm(s):
              s = s.replace('\u200f','').replace('\u200e','')
              s = re.sub(r'[\sـ]+', '', s)
              return s

          target = None
          waiting = False
          for child in doc.element.body.iterchildren():
              if child.tag == qn('w:p'):
                  text = ''.join(child.itertext())
                  n = norm(text)
                  if 'الجدول' in n and ('٢٥' in n or '25' in n) and 'مصفوفةالربطبينفصولالكتابودليلالأدوات' in n:
                      waiting = True
              elif child.tag == qn('w:tbl') and waiting:
                  for table in doc.tables:
                      if table._tbl is child:
                          target = table
                          break
                  break
          if target is None:
              raise RuntimeError('Table 25 was not found')
          if len(target.rows) < 2 or len(target.columns) < 4:
              raise RuntimeError(f'Unexpected Table 25 dimensions: {len(target.rows)}x{len(target.columns)}')

          headers = [norm(c.text) for c in target.rows[0].cells]
          idx = {}
          for i, h in enumerate(headers):
              if 'الفصل' in h:
                  idx['chapter'] = i
              elif 'الموضوع' in h:
                  idx['topic'] = i
              elif 'الأدوات' in h or 'المقترحة' in h:
                  idx['tools'] = i
              elif 'المخرج' in h or 'الرئيس' in h:
                  idx['output'] = i
          if set(idx) != {'chapter','topic','tools','output'}:
              raise RuntimeError(f'Could not map headers: {headers} -> {idx}')

          rows = [
              ('١','مشكلة القرار والنمو','١، ٣، ٤','صورة أولية للفجوة'),
              ('٢','البدء من القرار لا القالب','٥، ٦، ٨','حالة مستهدفة'),
              ('٣','التشخيص والانطباق','١–٨','تقرير تشخيص'),
              ('٤','هرم الوثائق','٩–١٢، ٢٧–٣٠، ٨١','هرم وثائق وسجل ضبط'),
              ('٥','الملكية والقيادة','١٣–١٤','خريطة حقوق وموضوعات محفوظة'),
              ('٦','المجلس واللجان','١٥–٢٣، ٧٧–٧٩، ٨٨','منظومة مجلس قابلة للتشغيل'),
              ('٧','الصلاحيات','٢٤–٢٦، ٤٠، ٨٠','مصفوفة صلاحيات'),
              ('٨','الثقافة والسلوك','٣١–٣٣، ٧٢–٧٣، ٨٢','منظومة سلوك وإفصاح'),
              ('٩','المخاطر والضوابط','٣٤–٣٩، ٨٣','سجل مخاطر وضوابط'),
              ('١٠','الضمان المستقل','٣٨–٣٩','خريطة ضمان وتحسين'),
              ('١١','المال والعقود','٤٠–٤٣','ضوابط مالية وتعاقدية'),
              ('١٢','البيانات والخصوصية والأمن والذكاء الاصطناعي','٤٤–٤٨','سجل أصول واستخدامات وضوابط'),
              ('١٣','الأدلة ومكتب الحوكمة','٥٤–٦٢، ٨٤','مكتب وسلسلة إثبات'),
              ('١٤','خطة المئة يوم','٤٩–٥٣، ٦٣–٦٦، ٨٥','خطة تنفيذ مئة يوم'),
              ('١٥','النضج والتناسب','٦٧–٧٦، ٨٦–٨٧','تقييم وخطة تحسين'),
          ]

          sample = deepcopy(target.rows[1]._tr)
          for tr in list(target._tbl.tr_lst)[1:]:
              target._tbl.remove(tr)

          def set_cell(cell, value):
              cell.text = value
              for p in cell.paragraphs:
                  p.alignment = WD_ALIGN_PARAGRAPH.CENTER
                  p.paragraph_format.space_before = Pt(0)
                  p.paragraph_format.space_after = Pt(0)
                  ppr = p._p.get_or_add_pPr()
                  if ppr.find(qn('w:bidi')) is None:
                      ppr.append(OxmlElement('w:bidi'))
                  for r in p.runs:
                      r.font.name = 'Amiri'
                      r.font.size = Pt(11.5)
                      rpr = r._r.get_or_add_rPr()
                      fonts = rpr.find(qn('w:rFonts'))
                      if fonts is None:
                          fonts = OxmlElement('w:rFonts')
                          rpr.insert(0, fonts)
                      for a in ('ascii','hAnsi','eastAsia','cs'):
                          fonts.set(qn('w:'+a), 'Amiri')
                      if rpr.find(qn('w:rtl')) is None:
                          rpr.append(OxmlElement('w:rtl'))

          for chapter, topic, tools, output in rows:
              target._tbl.append(deepcopy(sample))
              cells = target.rows[-1].cells
              set_cell(cells[idx['chapter']], chapter)
              set_cell(cells[idx['topic']], topic)
              set_cell(cells[idx['tools']], tools)
              set_cell(cells[idx['output']], output)

          settings = doc.settings.element
          update = settings.find(qn('w:updateFields'))
          if update is None:
              update = OxmlElement('w:updateFields')
              settings.append(update)
          update.set(qn('w:val'), 'true')
          for fld in doc.element.xpath('.//w:fldChar[@w:fldCharType="begin"]'):
              fld.set(qn('w:dirty'), 'true')

          doc.core_properties.title = 'الحوكمة من الصفر'
          doc.core_properties.language = 'ar-SA'
          doc.save(OUT)
          print(f'Saved {OUT} with corrected Table 25 ({len(rows)} rows).')
          PY
          python fix_book.py

      - name: Update Word indexes and export matching PDF
        run: |
          cat > update_fields.py <<'PY'
          import pathlib, subprocess, time, uno
          from com.sun.star.beans import PropertyValue

          def prop(name, value):
              p = PropertyValue(); p.Name = name; p.Value = value; return p

          proc = subprocess.Popen([
              'soffice','--headless','--nologo','--nodefault','--nofirststartwizard','--norestore',
              '--accept=socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext'
          ])
          try:
              local = uno.getComponentContext()
              resolver = local.ServiceManager.createInstanceWithContext('com.sun.star.bridge.UnoUrlResolver', local)
              ctx = None
              for _ in range(60):
                  try:
                      ctx = resolver.resolve('uno:socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext')
                      break
                  except Exception:
                      time.sleep(1)
              if ctx is None:
                  raise RuntimeError('Could not connect to LibreOffice')
              smgr = ctx.ServiceManager
              desktop = smgr.createInstanceWithContext('com.sun.star.frame.Desktop', ctx)
              src = pathlib.Path('book_preflight.docx').resolve().as_uri()
              doc = desktop.loadComponentFromURL(src, '_blank', 0, (prop('Hidden', True), prop('UpdateDocMode', 3)))
              if doc is None:
                  raise RuntimeError('Could not load DOCX')
              try:
                  doc.getTextFields().refresh()
              except Exception:
                  pass
              indexes = doc.getDocumentIndexes()
              print('Indexes:', indexes.getCount())
              for i in range(indexes.getCount()):
                  indexes.getByIndex(i).update()
              try:
                  doc.calculateAll()
              except Exception:
                  pass
              time.sleep(5)
              out_docx = pathlib.Path('الحوكمة_من_الصفر_النسخة_المصححة_النهائية.docx').resolve().as_uri()
              out_pdf = pathlib.Path('الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf').resolve().as_uri()
              doc.storeAsURL(out_docx, (prop('FilterName','Office Open XML Text'), prop('Overwrite',True)))
              for i in range(indexes.getCount()):
                  indexes.getByIndex(i).update()
              try:
                  doc.getTextFields().refresh()
              except Exception:
                  pass
              time.sleep(3)
              doc.storeToURL(out_pdf, (prop('FilterName','writer_pdf_Export'), prop('Overwrite',True), prop('UseTaggedPDF',True), prop('ExportBookmarks',True)))
              doc.close(True)
          finally:
              proc.terminate()
          PY
          /usr/bin/python3 update_fields.py
          test -s الحوكمة_من_الصفر_النسخة_المصححة_النهائية.docx
          test -s الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf

      - name: Generate clean back-cover and corrected spine proof
        run: |
          cat > make_cover_proofs.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display
          import subprocess, textwrap

          W,H=2008,2835
          IVORY='#F4EFE3'; PETROL='#164C5A'; GOLD='#B39756'; CHAR='#333333'
          def font_path(pattern):
              out=subprocess.check_output(['fc-match','-f','%{file}',pattern],text=True).strip()
              return out
          kufi=font_path('Noto Kufi Arabic')
          amiri=font_path('Amiri')
          def rtl(s): return get_display(arabic_reshaper.reshape(s))
          def wrap(draw, text, font, maxw):
              words=text.split(); lines=[]; cur=''
              for w in words:
                  test=(cur+' '+w).strip()
                  if draw.textbbox((0,0),rtl(test),font=font)[2] <= maxw: cur=test
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          img=Image.new('RGB',(W,H),IVORY); d=ImageDraw.Draw(img)
          d.rectangle((0,0,W,210),fill=PETROL)
          d.rectangle((130,285,W-130,300),fill=GOLD)
          titlef=ImageFont.truetype(kufi,94); subf=ImageFont.truetype(kufi,45); bodyf=ImageFont.truetype(amiri,46); smallf=ImageFont.truetype(amiri,32)
          d.text((W-150,380),rtl('حوكمة فعّالة تبدأ من القرار'),font=titlef,fill=PETROL,anchor='ra')
          d.text((W-150,545),rtl('دليل عملي للشركات السعودية من التأسيس إلى النضج'),font=subf,fill=GOLD,anchor='ra')
          para=('لا تبدأ الحوكمة بكثرة اللوائح، بل بوضوح القرار والمسؤولية والدليل. يقدم هذا الكتاب مسارًا عمليًا للشركات السعودية من تشخيص الواقع وتحديد الانطباق، إلى بناء الصلاحيات والمجلس والسياسات والضوابط، ثم تشغيل الحوكمة وقياس نضجها وتحسينها.')
          y=770
          for line in wrap(d,para,bodyf,W-300):
              d.text((W-150,y),rtl(line),font=bodyf,fill=CHAR,anchor='ra'); y+=78
          y+=80
          points=['تمييز المتطلبات الملزمة من الممارسات الاسترشادية','ربط السلطة بالمعلومات والتنفيذ والدليل','تصميم مجلس وصلاحيات وضوابط متناسبة','تحويل الحوكمة إلى خطة مئة يوم قابلة للقياس']
          for p in points:
              d.ellipse((W-180,y+18,W-160,y+38),fill=GOLD)
              d.text((W-210,y),rtl(p),font=bodyf,fill=CHAR,anchor='ra'); y+=105
          d.rectangle((130,H-430,W-130,H-415),fill=GOLD)
          d.text((W-150,H-350),rtl('الطبعة المنقحة الأولى | ٢٠٢٦م'),font=smallf,fill=PETROL,anchor='ra')
          img.save('الغلاف_الخلفي_النظيف_300DPI.png',dpi=(300,300))

          sw=1000
          sp=Image.new('RGB',(sw,H),IVORY); sd=ImageDraw.Draw(sp)
          sd.rectangle((0,0,sw,190),fill=PETROL)
          sd.text((sw-90,320),rtl('تخطيط الكعب'),font=ImageFont.truetype(kufi,72),fill=PETROL,anchor='ra')
          sd.text((sw-90,470),rtl('غير مقياس للطباعة'),font=ImageFont.truetype(kufi,42),fill=GOLD,anchor='ra')
          note='يُحسب العرض النهائي بعد اعتماد عدد صفحات ملف الطباعة، ونوع الورق وسماكته، وطريقة التجليد لدى المطبعة. لم يعد هذا الملف يفترض عدد ٢٠٥ صفحات.'
          y=690
          for line in wrap(sd,note,ImageFont.truetype(amiri,44),sw-180):
              sd.text((sw-90,y),rtl(line),font=ImageFont.truetype(amiri,44),fill=CHAR,anchor='ra'); y+=76
          sd.rectangle((90,1250,sw-90,1263),fill=GOLD)
          sd.text((sw//2,1500),rtl('الحوكمة من الصفر'),font=ImageFont.truetype(kufi,72),fill=PETROL,anchor='mm')
          sp.save('تخطيط_الكعب_بعد_التصحيح_غير_مقاس.png',dpi=(300,300))
          PY
          python make_cover_proofs.py

      - name: Audit final outputs
        run: |
          pdfinfo الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf > pdfinfo.txt
          pdftotext -layout الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf extracted.txt
          PAGES=$(awk '/^Pages:/ {print $2}' pdfinfo.txt)
          cat > audit.py <<'PY'
          from pathlib import Path
          import re, zipfile
          pdfinfo=Path('pdfinfo.txt').read_text(errors='ignore')
          m=re.search(r'^Pages:\s+(\d+)',pdfinfo,re.M); pages=int(m.group(1))
          text=Path('extracted.txt').read_text(errors='ignore')
          toc=text.split('جدول المحتويات',1)[1].split('قائمة الجداول',1)[0] if 'جدول المحتويات' in text and 'قائمة الجداول' in text else ''
          stale=[x for x in ('١٧٢','١٨٢','١٨٦','١٨٨','١٩١','١٩٦') if x in toc]
          with zipfile.ZipFile('الحوكمة_من_الصفر_النسخة_المصححة_النهائية.docx') as z:
              docxml=z.read('word/document.xml').decode('utf-8')
              settings=z.read('word/settings.xml').decode('utf-8')
          required=['خطة تنفيذ مئة يوم','هرم وثائق وسجل ضبط','٦٧–٧٦، ٨٦–٨٧']
          missing=[x for x in required if x not in docxml]
          report=[
              'تقرير التدقيق النهائي',
              f'عدد صفحات PDF: {pages}',
              f'جدول المحتويات/قائمة الجداول: تم تحديث الفهارس بواسطة LibreOffice UNO',
              f'الأرقام القديمة الحرجة المتبقية في نطاق جدول المحتويات: {stale or "لا يوجد"}',
              f'عناصر تصحيح الجدول ٢٥ المفقودة: {missing or "لا يوجد"}',
              f'تحديث الحقول عند الفتح: {"مفعّل" if "updateFields" in settings else "غير مفعّل"}',
              'الغلاف الخلفي: نسخة نظيفة بلا بيانات مؤلف أو ISBN مختلقة',
              'الكعب: أزيل افتراض ٢٠٥ صفحات، والعرض النهائي مؤجل لمواصفات المطبعة',
          ]
          Path('تقرير_التدقيق_النهائي.txt').write_text('\n'.join(report),encoding='utf-8')
          if missing:
              raise SystemExit('Table 25 audit failed: '+repr(missing))
          if pages < 150 or pages > 230:
              raise SystemExit(f'Unexpected PDF page count: {pages}')
          print('\n'.join(report))
          PY
          python audit.py

      - name: Build final package
        run: |
          mkdir -p package
          cp الحوكمة_من_الصفر_النسخة_المصححة_النهائية.docx package/
          cp الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf package/
          cp الغلاف_الخلفي_النظيف_300DPI.png package/
          cp تخطيط_الكعب_بعد_التصحيح_غير_مقاس.png package/
          cp تقرير_التدقيق_النهائي.txt package/
          (cd package && zip -9 -r ../الحوكمة_من_الصفر_حزمة_التصحيح_النهائية.zip .)

      - name: Upload corrected package
        uses: actions/upload-artifact@v4
        with:
          name: corrected-governance-book
          path: |
            package/*
            الحوكمة_من_الصفر_حزمة_التصحيح_النهائية.zip
          retention-days: 1
          if-no-files-found: error
