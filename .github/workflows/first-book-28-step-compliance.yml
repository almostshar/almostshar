name: First book 28-step compliance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/first_book_28_step_compliance.py'
      - '.github/workflows/first-book-28-step-compliance.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INTERIOR_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-53b4-8211-a5b8-76d567454f5b/raw?se=2026-08-05T07:26:23Z&sp=r&sv=2026-02-06&sr=b&scid=99245a4c-cc0c-57c8-95be-242880289c78&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:04:07Z&ske=2026-08-06T01:04:07Z&sks=b&skv=2026-02-06&sig=CgF13rERGAJ6euj33B1bWNQ4qOnlutUCSGF6R3%2BFyTQ%3D'
      FRONT_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-910c-8209-b66e-5d05530b4238/raw?se=2026-08-05T07:26:49Z&sp=r&sv=2026-02-06&sr=b&scid=99234be1-b2e0-5cc9-9f19-d7d0af69a6f2&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T02:14:57Z&ske=2026-08-06T02:14:57Z&sks=b&skv=2026-02-06&sig=pWhRXjsBWbsiQVMXROPmqjG0ySn%2Br4VN0pA0xARfwXI%3D'
      BACK_URL: 'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-1ba4-8208-ac07-b9c5addd2823/raw?se=2026-08-05T07:27:11Z&sp=r&sv=2026-02-06&sr=b&scid=fd32e16b-2037-5a71-b4d0-993b902ee312&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T03:25:19Z&ske=2026-08-06T03:25:19Z&sks=b&skv=2026-02-06&sig=PePVViE27G/35e09PtoWxBwCoTF%2BcjjOQk3slj6ymKE%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download exact source files
        run: |
          curl --fail --location --retry 4 --retry-delay 1 "$INTERIOR_URL" -o source_interior.docx
          curl --fail --location --retry 4 --retry-delay 1 "$FRONT_URL" -o source_front.docx
          curl --fail --location --retry 4 --retry-delay 1 "$BACK_URL" -o source_back_spine.docx
          python - <<'PY'
          from pathlib import Path
          for name in ('source_interior.docx','source_front.docx','source_back_spine.docx'):
              p=Path(name)
              print(name,p.stat().st_size,p.read_bytes()[:16])
              assert p.exists() and p.stat().st_size>1000, (name,p.stat().st_size if p.exists() else None)
              assert p.read_bytes()[:2] == b'PK', f'{name} is not a DOCX ZIP package'
          PY

      - name: Install Word, PDF and Arabic rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Amiri Quran'
          fc-match 'Noto Kufi Arabic'

      - name: Patch compliance script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/first_book_28_step_compliance.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def build_readme(audit):')
          end = s.index('\ndef package():', start)
          replacement = '''def build_readme(audit):
              text = (
                  "الحوكمة من الصفر — حزمة المراجعة الشاملة\\n\\n"
                  f"عدد صفحات نسخة PDF للمراجعة: {audit['pdf_pages']}\\n"
                  "تحتوي الحزمة على:\\n"
                  "- النسخة النهائية المطابقة لمعيار Word.\\n"
                  "- PDF للمراجعة البصرية، وليس شهادة PDF/X-4.\\n"
                  "- تقرير مطابقة الخطوات الثماني والعشرين Word وPDF.\\n"
                  "- قالب الغلاف الأمامي Word وPNG بدقة 300 DPI.\\n"
                  "- قالب الغلاف الخلفي والكعب Word وPNG.\\n"
                  "- ملف التدقيق الآلي ولوحات مراجعة جميع الصفحات.\\n\\n"
                  "البيانات الخارجية المتبقية: اسم المؤلف، السيرة، الناشر والشعار والموقع، ISBN والباركود وQR والتصنيف والسعر، ونوع الورق وسماكته وعرض الكعب واعتماد المطبعة.\\n"
              )
              README.write_text(text, encoding="utf-8")
          '''
          replacement = '\n'.join(line[12:] if line.startswith('            ') else line for line in replacement.splitlines()) + '\n'
          s = s[:start] + replacement + s[end+1:]

          old = '''        if is_box:
              stats["boxes"] += 1
              set_table_borders(table, color=LIGHT_GRAY, sz="0", side_accent=True)
          '''
          new = '''        if is_box:
              stats["boxes"] += 1
              trpr = table.rows[0]._tr.get_or_add_trPr()
              if trpr.find(qn("w:cantSplit")) is None:
                  trpr.append(OxmlElement("w:cantSplit"))
              set_table_borders(table, color=LIGHT_GRAY, sz="0", side_accent=True)
          '''
          if old not in s:
              raise SystemExit('Editorial-box patch target was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/first_book_28_step_compliance.py

      - name: Correct, update, render, audit and package
        run: |
          python scripts/first_book_28_step_compliance.py
          test -s 'output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx'
          test -s 'output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf'
          test -s 'output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf'
          test -s 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'
          unzip -t 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'

      - name: Upload final reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: first-book-28-step-compliance-final
          path: |
            الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip
            output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx
            output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.docx
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf
            output/audit_28_steps.json
          retention-days: 2
          if-no-files-found: error
