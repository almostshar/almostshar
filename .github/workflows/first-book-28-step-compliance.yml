name: First book 28-step compliance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/first_book_28_step_compliance.py'
      - '.github/workflows/first-book-28-step-compliance.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INTERIOR_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5d04-8211-95b7-51b0e1c1b652/raw?se=2026-08-05T07:33:08Z&sp=r&sv=2026-02-06&sr=b&scid=6b895d51-3cd7-55e1-93d0-af8a50a61885&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:35:36Z&ske=2026-08-06T01:35:36Z&sks=b&skv=2026-02-06&sig=zMHq1MLBicmGT4iixGRYF%2B/PSMmmI1ma04lE5QjHnC4%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download exact interior source
        run: |
          curl --fail --location --retry 4 --retry-delay 1 "$INTERIOR_URL" -o source_interior.docx
          python - <<'PY'
          from pathlib import Path
          p = Path('source_interior.docx')
          print(p.stat().st_size, p.read_bytes()[:16])
          assert p.exists() and p.stat().st_size > 1000
          assert p.read_bytes()[:2] == b'PK', 'Interior source is not a DOCX ZIP package'
          PY

      - name: Install Word, PDF and Arabic rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Amiri Quran'
          fc-match 'Noto Kufi Arabic'

      - name: Patch compliance script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/first_book_28_step_compliance.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def build_readme(audit):')
          end = s.index('\ndef package():', start)
          lines = [
              'def build_readme(audit):',
              '    text = (',
              '        "الحوكمة من الصفر — حزمة المراجعة الشاملة\\n\\n"',
              '        f"عدد صفحات نسخة PDF للمراجعة: {audit[\'pdf_pages\']}\\n"',
              '        "تحتوي الحزمة على:\\n"',
              '        "- النسخة النهائية المطابقة لمعيار Word.\\n"',
              '        "- PDF للمراجعة البصرية، وليس شهادة PDF/X-4.\\n"',
              '        "- تقرير مطابقة الخطوات الثماني والعشرين Word وPDF.\\n"',
              '        "- قالب الغلاف الأمامي Word وPNG بدقة 300 DPI.\\n"',
              '        "- قالب الغلاف الخلفي والكعب Word وPNG.\\n"',
              '        "- ملف التدقيق الآلي ولوحات مراجعة جميع الصفحات.\\n\\n"',
              '        "البيانات الخارجية المتبقية: اسم المؤلف، السيرة، الناشر والشعار والموقع، ISBN والباركود وQR والتصنيف والسعر، ونوع الورق وسماكته وعرض الكعب واعتماد المطبعة.\\n"',
              '    )',
              '    README.write_text(text, encoding="utf-8")',
              '',
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]

          needle = '        if is_box:\n            stats["boxes"] += 1\n'
          addition = (
              needle
              + '            trpr = table.rows[0]._tr.get_or_add_trPr()\n'
              + '            if trpr.find(qn("w:cantSplit")) is None:\n'
              + '                trpr.append(OxmlElement("w:cantSplit"))\n'
          )
          if needle not in s:
              raise SystemExit('Editorial-box block was not found')
          s = s.replace(needle, addition, 1)

          old_cover = '    p = doc.paragraphs[0]\n    p.alignment = WD_ALIGN_PARAGRAPH.CENTER\n'
          new_cover = '    p = doc.paragraphs[0] if doc.paragraphs else doc.add_paragraph()\n    p.alignment = WD_ALIGN_PARAGRAPH.CENTER\n'
          if old_cover not in s:
              raise SystemExit('Cover paragraph constructor was not found')
          s = s.replace(old_cover, new_cover, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/first_book_28_step_compliance.py

      - name: Correct, update, render, audit and package
        run: |
          python scripts/first_book_28_step_compliance.py
          test -s 'output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx'
          test -s 'output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf'
          test -s 'output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf'
          test -s 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'
          unzip -t 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'

      - name: Upload final reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: first-book-28-step-compliance-final
          path: |
            الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip
            output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx
            output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.docx
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf
            output/audit_28_steps.json
          retention-days: 2
          if-no-files-found: error
