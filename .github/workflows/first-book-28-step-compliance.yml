name: First book 28-step compliance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/first_book_28_step_compliance.py'
      - '.github/workflows/first-book-28-step-compliance.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INTERIOR_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-df08-8207-9808-9681a0661386/raw?se=2026-08-05T07:21:28Z&sp=r&sv=2026-02-06&sr=b&scid=c930eeaa-c00f-5399-88aa-0f63df4cdf08&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:51:11Z&ske=2026-08-06T01:51:11Z&sks=b&skv=2026-02-06&sig=e7AQhEx1MBG6H31ZBfuNSJ32IM9lwkO7ENGzUV2DcFM%3D'
      FRONT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1998-8206-9823-c6e6b4a80c3f/raw?se=2026-08-05T07:21:48Z&sp=r&sv=2026-02-06&sr=b&scid=3ead990a-3e59-59d6-80e6-cea3337f2dbd&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T01:51:34Z&ske=2026-08-06T01:51:34Z&sks=b&skv=2026-02-06&sig=/tCvY69A9ETVUhMWQyPCWRzN9I9NG%2BeooHh%2BNGAzyRs%3D'
      BACK_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-5ef0-8206-b895-50e8691d2d1c/raw?se=2026-08-05T07:22:03Z&sp=r&sv=2026-02-06&sr=b&scid=c3de3f4c-416a-5ec0-8259-f6a2f7f35318&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:41:21Z&ske=2026-08-06T00:41:21Z&sks=b&skv=2026-02-06&sig=XRyvo8G8UNB1mJUj6o4N63OIh14dO1GNfkH3jDKeuPk%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download exact source files
        run: |
          curl --fail --location --retry 4 --retry-delay 1 "$INTERIOR_URL" -o source_interior.docx
          curl --fail --location --retry 4 --retry-delay 1 "$FRONT_URL" -o source_front.docx
          curl --fail --location --retry 4 --retry-delay 1 "$BACK_URL" -o source_back_spine.docx
          python - <<'PY'
          from pathlib import Path
          for name in ('source_interior.docx','source_front.docx','source_back_spine.docx'):
              p=Path(name)
              print(name,p.stat().st_size,p.read_bytes()[:16])
              assert p.exists() and p.stat().st_size>1000, (name,p.stat().st_size if p.exists() else None)
              assert p.read_bytes()[:2] == b'PK', f'{name} is not a DOCX ZIP package'
          PY

      - name: Install Word, PDF and Arabic rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Amiri Quran'
          fc-match 'Noto Kufi Arabic'

      - name: Syntax check
        run: python -m py_compile scripts/first_book_28_step_compliance.py

      - name: Correct, update, render, audit and package
        run: |
          python scripts/first_book_28_step_compliance.py
          test -s 'output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx'
          test -s 'output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf'
          test -s 'output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf'
          test -s 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'
          unzip -t 'الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip'

      - name: Upload final reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: first-book-28-step-compliance-final
          path: |
            الحوكمة_من_الصفر_حزمة_المراجعة_الشاملة.zip
            output/الحوكمة_من_الصفر_النسخة_المطابقة_للمعيار.docx
            output/الحوكمة_من_الصفر_نسخة_المراجعة.pdf
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.docx
            output/تقرير_مطابقة_الحوكمة_من_الصفر_للخطوات_28.pdf
            output/audit_28_steps.json
          retention-days: 2
          if-no-files-found: error
