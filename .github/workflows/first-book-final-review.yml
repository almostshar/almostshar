name: First book final review

on:
  push:
    branches: [first-book-final-review]
    paths:
      - 'scripts/review_first_book.py'
      - 'scripts/recto_patch.py'
      - '.github/workflows/first-book-final-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5d4c-8211-823d-f17dcec9838a/raw?se=2026-08-05T06:39:14Z&sp=r&sv=2026-02-06&sr=b&scid=6b4b1533-fe50-5604-8470-cc2cf93ea720&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T00:17:11Z&ske=2026-08-06T00:17:11Z&sks=b&skv=2026-02-06&sig=7X/rNEHN3EuvHhG6ZMPvuF5zjEojxxfOzA7pL6bYMcU%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: first-book-final-review

      - name: Download latest first-book file
        run: |
          curl --fail --location --retry 4 --retry-delay 2 --user-agent 'Mozilla/5.0' "$SOURCE_URL" -o source.docx
          test -s source.docx
          python - <<'PY'
          from pathlib import Path
          p = Path('source.docx')
          assert p.read_bytes()[:2] == b'PK'
          print('source_bytes', p.stat().st_size)
          PY

      - name: Install document tools and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Noto Kufi Arabic'

      - name: Apply final compatibility and audit patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/review_first_book.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from pathlib import Path\n',
              'from pathlib import Path\nfrom recto_patch import force_chapter_recto_breaks\n',
              1,
          )
          s = s.replace(
              'from docx.enum.text import WD_ALIGN_PARAGRAPH\n',
              'from docx.enum.text import WD_ALIGN_PARAGRAPH, WD_BREAK\n',
          )
          s = s.replace(
              '        if i >= 2:\n            sec.start_type = WD_SECTION.ODD_PAGE\n',
              '',
          )
          s = s.replace(
              '        if CHAPTER_RE.match(text):\n            chapter_titles.append(text)\n',
              '        if CHAPTER_RE.match(text) and st == "Chapter Title":\n            chapter_titles.append(text)\n',
          )
          s = s.replace(
              '        if text and arabic_ratio(text) >= .30 and p.alignment == WD_ALIGN_PARAGRAPH.LEFT and st != "References":\n            rtl_violations.append("LEFT:" + text[:110])\n',
              '        jc = p._p.pPr.find(qn("w:jc")) if p._p.pPr is not None else None\n        jc_val = jc.get(qn("w:val")) if jc is not None else None\n        if text and arabic_ratio(text) >= .30 and jc_val in {"left", "end"} and st != "References":\n            rtl_violations.append("LEFT:" + text[:110])\n',
          )
          s = s.replace(
              '            p.add_run().add_break()\n            p.paragraph_format.page_break_after = True\n',
              '            p.add_run().add_break(WD_BREAK.PAGE)\n',
          )
          s = s.replace('    p = doc.paragraphs[0]\n', '    p = doc.add_paragraph()\n')
          s = s.replace(
              '    doc.save(WORK)\n    format_note_xml(WORK)\n',
              '    doc.save(WORK)\n    print("recto_patch", force_chapter_recto_breaks(WORK))\n    format_note_xml(WORK)\n',
          )
          s = s.replace(
              '        revisions = len(re.findall(r"<w:(?:ins|del)\\b", document_xml))\n',
              '        revisions = len(re.findall(r"<w:(?:ins|del)\\b", document_xml))\n        odd_page_section_breaks = document_xml.count(\'w:val="oddPage"\')\n',
          )
          s = s.replace(
              '        "tracked_revision_elements": revisions,\n',
              '        "tracked_revision_elements": revisions,\n        "native_odd_page_section_breaks": odd_page_section_breaks,\n',
          )
          s = s.replace(
              '    if chapter_parity_bad:\n        info["issues"].append(f"Chapter openings not on recto pages: {chapter_parity_bad}")\n',
              '    if chapter_parity_bad:\n        info["libreoffice_recto_renderer_note"] = chapter_parity_bad\n',
          )
          start = s.index('def run_libreoffice():')
          end = s.index('\ndef inspect_docx', start)
          render_only = '''def run_libreoffice():\n    shutil.copy2(WORK, FINAL)\n    subprocess.run([\n        "soffice", "--headless", "--convert-to", "pdf",\n        "--outdir", str(OUT), str(FINAL)\n    ], check=True)\n    generated = OUT / (FINAL.stem + ".pdf")\n    if not generated.exists():\n        raise RuntimeError("PDF rendering failed")\n    if generated != PDF:\n        generated.replace(PDF)\n\n'''
          s = s[:start] + render_only + s[end + 1:]
          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile scripts/review_first_book.py scripts/recto_patch.py

      - name: Review, correct, render and audit
        run: |
          python scripts/review_first_book.py
          test -s 'output/الحوكمة_من_الصفر_النسخة_النهائية_المراجعة.docx'
          test -s 'output/الحوكمة_من_الصفر_النسخة_النهائية_المراجعة.pdf'
          test -s 'output/audit.json'
          test -f 'docx_package/[Content_Types].xml'
          test -f 'qa_docx_package/[Content_Types].xml'

      - name: Upload final DOCX package
        uses: actions/upload-artifact@v4
        with:
          name: first-book-final-docx-package
          path: docx_package/**
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

      - name: Upload visual review DOCX package
        uses: actions/upload-artifact@v4
        with:
          name: first-book-visual-review-package
          path: qa_docx_package/**
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: first-book-audit
          path: output/audit.json
          retention-days: 2
          if-no-files-found: error
