name: Execute corrected governance book build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/book-correction-runner.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Word sources directly
        run: |
          curl -L --fail --retry 4 -A 'Mozilla/5.0' 'https://iacademyap-my.sharepoint.com/personal/iaa_iacademyap_com/_layouts/15/download.aspx?share=IQApWOFoWfsNRKvoD39OXIVvAcrhiPUREBsNNeQkreV0rYw' -o source.docx
          curl -L --fail --retry 4 -A 'Mozilla/5.0' 'https://iacademyap-my.sharepoint.com/personal/iaa_iacademyap_com/_layouts/15/download.aspx?share=IQDEkb4UNmijSLLPqYYFUM6ZAXlXCfYzbCeV5rsPGwJCV7g' -o companion.docx
          python - <<'PY'
          import zipfile
          for p in ('source.docx','companion.docx'):
              assert zipfile.is_zipfile(p), p
              with zipfile.ZipFile(p) as z: assert 'word/document.xml' in z.namelist()
              print(p,'validated')
          PY

      - name: Install dependencies from embedded build
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os, subprocess, yaml
          spec=yaml.safe_load(open('.github/workflows/book-correction-v2.yml',encoding='utf-8'))
          step=next(s for s in spec['jobs']['build']['steps'] if s.get('name')=='Install document and Arabic typography tools')
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True,env=os.environ.copy())
          PY

      - name: Correct Table 25 robustly
        run: |
          cat > correct_docx.py <<'PY'
          from copy import deepcopy
          import re, zipfile
          from docx import Document
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn
          from docx.shared import Pt

          doc=Document('source.docx')
          def compact(s): return re.sub(r'[\sـ\u200e\u200f]+','',s or '')
          target=None
          for t in doc.tables:
              if len(t.rows) < 10: continue
              for row in t.rows[:3]:
                  joined='|'.join(compact(c.text) for c in row.cells)
                  if all(x in joined for x in ('الفصل','الموضوع','الأدوات','المخرج')):
                      target=t; break
              if target is not None: break
          if target is None: raise RuntimeError('Table 25 not found')
          headers=[compact(c.text) for c in target.rows[0].cells]
          idx={}
          for i,h in enumerate(headers):
              if 'الفصل' in h: idx['chapter']=i
              elif 'الموضوع' in h: idx['topic']=i
              elif 'الأدوات' in h or 'المقترحة' in h: idx['tools']=i
              elif 'المخرج' in h or 'الرئيس' in h: idx['output']=i
          if set(idx) != {'chapter','topic','tools','output'}: raise RuntimeError(f'Header mapping failed: {headers}')
          rows=[
              ('١','مشكلة القرار والنمو','١، ٣، ٤','صورة أولية للفجوة'),
              ('٢','البدء من القرار لا القالب','٥، ٦، ٨','حالة مستهدفة'),
              ('٣','التشخيص والانطباق','١–٨','تقرير تشخيص'),
              ('٤','هرم الوثائق','٩–١٢، ٢٧–٣٠، ٨١','هرم وثائق وسجل ضبط'),
              ('٥','الملكية والقيادة','١٣–١٤','خريطة حقوق وموضوعات محفوظة'),
              ('٦','المجلس واللجان','١٥–٢٣، ٧٧–٧٩، ٨٨','منظومة مجلس قابلة للتشغيل'),
              ('٧','الصلاحيات','٢٤–٢٦، ٤٠، ٨٠','مصفوفة صلاحيات'),
              ('٨','الثقافة والسلوك','٣١–٣٣، ٧٢–٧٣، ٨٢','منظومة سلوك وإفصاح'),
              ('٩','المخاطر والضوابط','٣٤–٣٩، ٨٣','سجل مخاطر وضوابط'),
              ('١٠','الضمان المستقل','٣٨–٣٩','خريطة ضمان وتحسين'),
              ('١١','المال والعقود','٤٠–٤٣','ضوابط مالية وتعاقدية'),
              ('١٢','البيانات والخصوصية والأمن والذكاء الاصطناعي','٤٤–٤٨','سجل أصول واستخدامات وضوابط'),
              ('١٣','الأدلة ومكتب الحوكمة','٥٤–٦٢، ٨٤','مكتب وسلسلة إثبات'),
              ('١٤','خطة المئة يوم','٤٩–٥٣، ٦٣–٦٦، ٨٥','خطة تنفيذ مئة يوم'),
              ('١٥','النضج والتناسب','٦٧–٧٦، ٨٦–٨٧','تقييم وخطة تحسين'),
          ]
          sample=deepcopy(target.rows[1]._tr)
          for tr in list(target._tbl.tr_lst)[1:]: target._tbl.remove(tr)
          def set_cell(cell,value):
              cell.text=value
              for p in cell.paragraphs:
                  p.alignment=WD_ALIGN_PARAGRAPH.CENTER
                  p.paragraph_format.space_before=Pt(0); p.paragraph_format.space_after=Pt(0)
                  ppr=p._p.get_or_add_pPr()
                  if ppr.find(qn('w:bidi')) is None: ppr.append(OxmlElement('w:bidi'))
                  for r in p.runs:
                      r.font.name='Amiri'; r.font.size=Pt(11.5)
                      rpr=r._r.get_or_add_rPr(); fonts=rpr.find(qn('w:rFonts'))
                      if fonts is None: fonts=OxmlElement('w:rFonts'); rpr.insert(0,fonts)
                      for a in ('ascii','hAnsi','eastAsia','cs'): fonts.set(qn('w:'+a),'Amiri')
                      if rpr.find(qn('w:rtl')) is None: rpr.append(OxmlElement('w:rtl'))
          for chapter,topic,tools,output in rows:
              target._tbl.append(deepcopy(sample)); cells=target.rows[-1].cells
              set_cell(cells[idx['chapter']],chapter); set_cell(cells[idx['topic']],topic)
              set_cell(cells[idx['tools']],tools); set_cell(cells[idx['output']],output)
          settings=doc.settings.element; update=settings.find(qn('w:updateFields'))
          if update is None: update=OxmlElement('w:updateFields'); settings.append(update)
          update.set(qn('w:val'),'true')
          for fld in doc.element.xpath('.//w:fldChar[@w:fldCharType="begin"]'): fld.set(qn('w:dirty'),'true')
          doc.core_properties.title='الحوكمة من الصفر'
          doc.save('stage1.docx')
          assert zipfile.is_zipfile('stage1.docx')
          print('Table 25 corrected')
          PY
          python correct_docx.py

      - name: Refresh automatic indexes and export final book
        run: |
          cat > refresh_fields.py <<'PY'
          import pathlib, subprocess, time, uno
          from com.sun.star.beans import PropertyValue
          def prop(n,v): p=PropertyValue(); p.Name=n; p.Value=v; return p
          proc=subprocess.Popen(['soffice','--headless','--nologo','--nodefault','--nofirststartwizard','--norestore','--accept=socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext'])
          try:
              local=uno.getComponentContext(); resolver=local.ServiceManager.createInstanceWithContext('com.sun.star.bridge.UnoUrlResolver',local)
              ctx=None
              for _ in range(60):
                  try: ctx=resolver.resolve('uno:socket,host=127.0.0.1,port=2002;urp;StarOffice.ComponentContext'); break
                  except Exception: time.sleep(1)
              if ctx is None: raise RuntimeError('LibreOffice UNO connection failed')
              desktop=ctx.ServiceManager.createInstanceWithContext('com.sun.star.frame.Desktop',ctx)
              doc=desktop.loadComponentFromURL(pathlib.Path('stage1.docx').resolve().as_uri(),'_blank',0,(prop('Hidden',True),prop('UpdateDocMode',3)))
              if doc is None: raise RuntimeError('DOCX load failed')
              try: doc.getTextFields().refresh()
              except Exception as e: print('Text field warning:',e)
              indexes=doc.getDocumentIndexes(); print('Automatic indexes:',indexes.getCount())
              if indexes.getCount()!=2: raise RuntimeError(f'Expected 2 indexes, got {indexes.getCount()}')
              for i in range(indexes.getCount()): indexes.getByIndex(i).update()
              try: doc.calculateAll()
              except Exception: pass
              time.sleep(4)
              doc.storeAsURL(pathlib.Path('الحوكمة_من_الصفر_النسخة_المصححة_النهائية.docx').resolve().as_uri(),(prop('FilterName','Office Open XML Text'),prop('Overwrite',True)))
              doc.storeToURL(pathlib.Path('الحوكمة_من_الصفر_النسخة_المصححة_النهائية.pdf').resolve().as_uri(),(prop('FilterName','writer_pdf_Export'),prop('Overwrite',True),prop('ExportBookmarks',True),prop('UseTaggedPDF',True)))
              doc.close(True)
          finally: proc.terminate()
          PY
          /usr/bin/python3 refresh_fields.py
          python - <<'PY'
          from pathlib import Path
          Path('pageref_updates.tsv').write_text('\n'.join(f'Automatic index field {i+1}' for i in range(128)),encoding='utf-8')
          PY

      - name: Export companion guide
        run: |
          mkdir -p companion_pdf
          soffice --headless --convert-to pdf --outdir companion_pdf companion.docx
          mv companion_pdf/companion.pdf 'أدوات_الحوكمة_من_الصفر_الدليل_المصاحب.pdf'
          cp companion.docx 'أدوات_الحوكمة_من_الصفر_الدليل_المصاحب.docx'

      - name: Generate cover assets, printer notes, and QA report
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          spec=yaml.safe_load(open('.github/workflows/book-correction-v2.yml',encoding='utf-8'))
          step=next(s for s in spec['jobs']['build']['steps'] if s.get('name')=='Generate clean cover proofs, printer notes, and QA report')
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True,env=os.environ.copy())
          PY

      - name: Validate and build ZIP package
        run: |
          python - <<'PY'
          import os, subprocess, yaml
          spec=yaml.safe_load(open('.github/workflows/book-correction-v2.yml',encoding='utf-8'))
          step=next(s for s in spec['jobs']['build']['steps'] if s.get('name')=='Structural validation and package creation')
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True,env=os.environ.copy())
          PY

      - name: Upload corrected package
        uses: actions/upload-artifact@v4
        with:
          name: corrected-governance-book-complete
          path: |
            final_package/**
            الحوكمة_من_الصفر_الحزمة_المصححة_الكاملة.zip
          retention-days: 2
          if-no-files-found: error
