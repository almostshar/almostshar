name: Government book production

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_government_book.py'
      - '.github/workflows/government-book-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-de98-81fa-9b44-b6cf16ed28e7/raw?se=2026-08-04T12:08:23Z&sp=r&sv=2026-02-06&sr=b&scid=7e8e5532-c16e-59f5-af05-6f42d9ff29fe&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T23:23:25Z&ske=2026-08-04T23:23:25Z&sks=b&skv=2026-02-06&sig=UESWiEv5GWhA5hoEP%2B1w7Q70BidHuMFFW21h2LMRh1E%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download manuscript
        run: |
          curl --fail --location --retry 4 --retry-delay 3 --user-agent 'Mozilla/5.0' "$SOURCE_URL" -o source.docx
          test -s source.docx
          python - <<'PY'
          from pathlib import Path
          p=Path('source.docx')
          assert p.read_bytes()[:2] == b'PK', 'Downloaded file is not a DOCX ZIP package'
          print('source bytes',p.stat().st_size)
          PY

      - name: Install document and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-noto-extra
          sudo apt-get install -y -qq fonts-hosny-amiri || true
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Noto Kufi Arabic'

      - name: Build, update, render and audit book
        run: |
          python scripts/build_government_book.py
          test -s 'output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.docx'
          test -s 'output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.pdf'
          test -s 'دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip'
          unzip -t 'دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip'

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: government-achievement-book-final
          path: |
            دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip
            output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.docx
            output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.pdf
            output/تقرير_التدقيق_النهائي.pdf
            output/audit.json
          retention-days: 2
          if-no-files-found: error
