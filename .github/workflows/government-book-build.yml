name: Government book production

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_government_book.py'
      - '.github/workflows/government-book-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_URL: 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-b33c-81fa-b598-694ff6879469/raw?se=2026-08-04T12:25:29Z&sp=r&sv=2026-02-06&sr=b&scid=3fa2fc69-6137-5491-87e2-ad69ca943044&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T23:01:00Z&ske=2026-08-04T23:01:00Z&sks=b&skv=2026-02-06&sig=tObhqiin/a0H75B0bXZ%2BBkaIPvyrHNZotcMB78wSpV0%3D'
    steps:
      - uses: actions/checkout@v4

      - name: Download manuscript
        run: |
          curl --fail --location --retry 4 --retry-delay 3 --user-agent 'Mozilla/5.0' "$SOURCE_URL" -o source.docx
          test -s source.docx
          python - <<'PY'
          from pathlib import Path
          p=Path('source.docx')
          assert p.read_bytes()[:2] == b'PK', 'Downloaded file is not a DOCX ZIP package'
          print('source bytes',p.stat().st_size)
          PY

      - name: Install document and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Noto Kufi Arabic'

      - name: Patch and syntax-check production script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build_government_book.py')
          s=p.read_text(encoding='utf-8')
          old='''    try:\n        style = styles[name]\n    except KeyError:\n        style = styles.add_style(name, WD_STYLE_TYPE.PARAGRAPH)\n'''
          new='''    try:\n        style = styles[name]\n        if style.type != WD_STYLE_TYPE.PARAGRAPH:\n            style.element.getparent().remove(style.element)\n            style = styles.add_style(name, WD_STYLE_TYPE.PARAGRAPH)\n    except KeyError:\n        style = styles.add_style(name, WD_STYLE_TYPE.PARAGRAPH)\n'''
          if old not in s:
              raise SystemExit('Style patch target not found')
          s=s.replace(old,new)
          s=s.replace('full_title = title_indices[1] if len(title_indices) > 1 else first_title', 'full_title = title_indices[-1] if len(title_indices) > 1 else first_title')
          s=s.replace('pgmar.set(qn("w:gutter"), str(int(Cm(.7))))', 'pgmar.set(qn("w:gutter"), "397")')
          marker='''    for p in doc.paragraphs:\n        t = paragraph_text(p)\n        if t in ("فهرس المحتويات", "قائمة الجداول", "قائمة الأشكال"):\n            p.style = "TOC Heading"\n'''
          replacement='''    for p in doc.paragraphs:\n        t = paragraph_text(p)\n        if t in ("فهرس المحتويات", "قائمة الجداول", "قائمة الأشكال"):\n            p.style = "TOC Heading"\n        if p._p.xpath('.//w:drawing') or p._p.xpath('.//w:pict'):\n            p.alignment = WD_ALIGN_PARAGRAPH.CENTER\n'''
          s=s.replace(marker,replacement)
          start=s.index('def make_readme(audit: dict):')
          end=s.index('\ndef package():', start)
          replacement_readme='''def make_readme(audit: dict):\n    text = (\n        "دوائر الإنجاز الحكومي — حزمة التسليم النهائية\\n\\n"\n        "تتضمن الحزمة:\\n"\n        "1. النسخة النهائية القابلة للتحرير بصيغة Word.\\n"\n        "2. نسخة PDF مطابقة للمراجعة.\\n"\n        "3. الغلاف الأمامي والخلفي بدقة 300 DPI.\\n"\n        "4. دليل كعب غير مقياس حتى وصول مواصفات المطبعة.\\n"\n        "5. مواصفات الطباعة والتجليد.\\n"\n        "6. تقرير التدقيق وملف audit.json.\\n"\n        "7. لوحات مراجعة مصغرة لجميع الصفحات.\\n\\n"\n        f"عدد صفحات النسخة النهائية: {audit['pdf_pages']}\\n"\n        "مهم: لا يزال ملف الغلاف الكامل CMYK/PDF-X وعرض الكعب النهائي مرتبطين بمواصفات الورق والتجليد وبيانات المؤلف والناشر وISBN.\\n"\n    )\n    README.write_text(text, encoding="utf-8")\n\n'''
          s=s[:start]+replacement_readme+s[end+1:]
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile scripts/build_government_book.py

      - name: Build, update, render and audit book
        run: |
          python scripts/build_government_book.py
          test -s 'output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.docx'
          test -s 'output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.pdf'
          test -s 'دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip'
          unzip -t 'دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip'

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: government-achievement-book-final
          path: |
            دوائر_الإنجاز_الحكومي_الحزمة_النهائية.zip
            output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.docx
            output/دوائر_الإنجاز_الحكومي_النسخة_النهائية.pdf
            output/تقرير_التدقيق_النهائي.pdf
            output/audit.json
          retention-days: 2
          if-no-files-found: error
