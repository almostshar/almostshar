name: Vision 2030 security book production

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/vision2030_security_book.py'
      - '.github/workflows/vision2030-security-book.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_URL: 'https://iacademyap-my.sharepoint.com/:w:/p/iaa/IQBENqePffrST40tRTeoxUtIAXKyjSiui00os9poy72gXlY'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and download exact manuscript
        run: |
          curl --fail --location --retry 3 --retry-delay 2 --user-agent 'Mozilla/5.0' "$SOURCE_URL" -o sharepoint_viewer.html
          python - <<'PY'
          from pathlib import Path
          import html, json, re
          text=Path('sharepoint_viewer.html').read_text(encoding='utf-8',errors='ignore')
          patterns=[
              r'["\'](?:\.downloadUrl|downloadUrl)["\']\s*:\s*["\']([^"\']+)',
              r'\\?"(?:\\?\.downloadUrl|downloadUrl)\\?"\s*:\s*\\?"([^"\r\n]+)',
              r'https?[^"\'<>\s]+(?:download|content)[^"\'<>\s]+',
          ]
          candidates=[]
          for pat in patterns:
              candidates.extend(re.findall(pat,text,re.I))
          cleaned=[]
          for value in candidates:
              if isinstance(value,tuple): value=value[0]
              value=html.unescape(value)
              value=value.replace('\\/','/').replace('\\u002f','/').replace('\\u002F','/').replace('\\u003a',':').replace('\\u003A',':').replace('\\u0026','&').replace('\\u003d','=').replace('\\u003D','=')
              value=value.replace('\\"','"')
              if value.startswith('http') and value not in cleaned:
                  cleaned.append(value)
          print('resolved_candidates',len(cleaned))
          for i,url in enumerate(cleaned[:10]): print(i,url[:240])
          if not cleaned:
              for token in ('downloadUrl','DownloadUrl','@microsoft.graph.downloadUrl'):
                  pos=text.find(token)
                  if pos>=0: print('context',text[max(0,pos-300):pos+800])
              raise SystemExit('No download URL found in SharePoint viewer HTML')
          Path('resolved_urls.txt').write_text('\n'.join(cleaned),encoding='utf-8')
          PY
          : > source_interior.docx
          while IFS= read -r URL; do
            rm -f candidate.docx
            curl --location --retry 2 --retry-delay 1 --user-agent 'Mozilla/5.0' "$URL" -o candidate.docx || true
            if python - <<'PY'
          from pathlib import Path
          p=Path('candidate.docx')
          raise SystemExit(0 if p.exists() and p.stat().st_size>1000 and p.read_bytes()[:2]==b'PK' else 1)
          PY
            then
              mv candidate.docx source_interior.docx
              break
            fi
          done < resolved_urls.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('source_interior.docx')
          assert p.exists() and p.stat().st_size > 1000, 'Resolved URLs did not return the manuscript'
          assert p.read_bytes()[:2] == b'PK', f'Source is not a DOCX package: {p.read_bytes()[:80]!r}'
          print('source_bytes',p.stat().st_size)
          PY

      - name: Install Arabic Word and PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer python3-uno poppler-utils ghostscript fonts-noto-core fonts-hosny-amiri
          python -m pip install --quiet python-docx lxml pymupdf pillow arabic-reshaper python-bidi
          fc-cache -f
          fc-match 'Amiri'
          fc-match 'Amiri Quran'
          fc-match 'Noto Kufi Arabic'

      - name: Patch strict chapter-opening audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/vision2030_security_book.py')
          s=p.read_text(encoding='utf-8')
          old='''        if re.search(r"الفصل\\s+(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|الحادي عشر|الثاني عشر|الثالث عشر|الرابع عشر)",text): chapter_pages.append(i)'''
          new='''        page_lines=[clean(line) for line in text.splitlines() if clean(line)]\n        page_head=[line for line in page_lines[:8] if line != BOOK_TITLE and not re.fullmatch(r"[٠-٩0-9]+", line)]\n        if any(CHAPTER_RE.match(line) for line in page_head[:4]): chapter_pages.append(i)'''
          if old not in s:
              raise SystemExit('Chapter audit target was not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax check
        run: |
          python -m py_compile scripts/vision2030_security_book.py

      - name: Format, update, render, audit and package
        run: |
          python scripts/vision2030_security_book.py
          test -s 'output/رؤية_المملكة_2030_والأمن_الشامل_النسخة_النهائية.docx'
          test -s 'output/رؤية_المملكة_2030_والأمن_الشامل_نسخة_الطباعة_الرمادية.pdf'
          test -s 'output/تقرير_مطابقة_رؤية_المملكة_2030_والأمن_الشامل_للخطوات_28.pdf'
          test -s 'رؤية_المملكة_2030_والأمن_الشامل_الحزمة_النهائية.zip'
          unzip -t 'رؤية_المملكة_2030_والأمن_الشامل_الحزمة_النهائية.zip'

      - name: Upload verified final package
        uses: actions/upload-artifact@v4
        with:
          name: vision2030-security-book-final
          path: |
            رؤية_المملكة_2030_والأمن_الشامل_الحزمة_النهائية.zip
            output/رؤية_المملكة_2030_والأمن_الشامل_النسخة_النهائية.docx
            output/رؤية_المملكة_2030_والأمن_الشامل_نسخة_الطباعة_الرمادية.pdf
            output/رؤية_المملكة_2030_والأمن_الشامل_الغلاف_الأمامي.docx
            output/رؤية_المملكة_2030_والأمن_الشامل_الغلاف_الخلفي.docx
            output/تقرير_مطابقة_رؤية_المملكة_2030_والأمن_الشامل_للخطوات_28.pdf
            output/audit_28_steps.json
          retention-days: 2
          if-no-files-found: error
